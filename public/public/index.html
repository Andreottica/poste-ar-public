<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poste.ar 24/7 pp public</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff; color: #111;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px; max-width: 640px;
      margin: 0 auto; padding: 24px 16px;
      transition: background 0.2s, color 0.2s;
    }
    .marker { font-weight: bold; margin-right: 6px; color: #00c; }
    body.noche .marker { color: #6ab0f5; }
    @media (max-width: 600px) {
      body { font-size: 14px; padding: 12px 10px; letter-spacing: -0.3px; }
      h1 { font-size: 19px; }
      .post p { line-height: 1.3; }
      .tagline { font-size: 13px; color: #444; }
      #estado { font-size: 12px; color: #666; }
      #charcount { font-size: 12px; color: #666; }
      .meta { font-size: 13px; }
      .public { font-size: 0.7em; }
    }
    body.noche .meta { color: #e8620a; }
    body.noche .tagline { color: #aaa; }
    body.noche #estado { color: #888; }
    body.noche #charcount { color: #777; }
    @media (max-width: 600px) {
      body.noche .meta { color: #e8620a; }
      body.noche .tagline { color: #bbb; }
      body.noche #estado { color: #999; }
      body.noche #charcount { color: #888; }
      body.noche .public { color: #aaa; }
    }
    header { border-bottom: 2px solid #ddd; padding-bottom: 12px; margin-bottom: 20px; }
    h1 { font-size: 22px; letter-spacing: -1px; }
    .azul { color: #6ab0f5; }
    .public { color: #999; font-size: 0.75em; font-weight: normal; }
    .tagline { font-size: 12px; color: #555; margin-top: 4px; }
    #estado { font-size: 11px; color: #999; margin-top: 4px; }
    #search {
      width: 100%; border: 1px solid #ddd; padding: 6px 8px;
      font-family: inherit; font-size: 14px; margin-bottom: 16px; outline: none;
    }
    #search:focus { border-color: #aaa; }
    #editor {
      width: 100%; border: 1px solid #ddd; padding: 8px;
      font-family: inherit; font-size: 14px;
      resize: vertical; min-height: 72px; outline: none; margin-bottom: 6px;
    }
    #editor:focus { border-color: #aaa; }
    #charcount { font-size: 11px; color: #999; text-align: right; margin-bottom: 8px; }
    #charcount.over { color: #c00; }
    .botones { display: flex; gap: 8px; margin-bottom: 24px; align-items: center; }
    button {
      background: #111; color: #fff; border: none;
      padding: 7px 18px; font-family: inherit; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #333; }
    button:disabled { background: #999; cursor: default; }
    .btn-secundario { background: #fff; color: #111; border: 1px solid #ccc; }
    .btn-secundario:hover { background: #f5f5f5; }
    .btn-dn {
      background: none; border: 1px solid #ccc; color: #999;
      font-size: 11px; padding: 4px 7px; cursor: pointer;
      font-family: inherit; margin-left: auto;
    }
    .btn-dn:hover { background: #f5f5f5; color: #111; }
    .post { border-bottom: 1px solid #bbb; padding: 10px 0; }
    .meta { font-size: inherit; color: #c00; display: block; margin-bottom: 4px; }
    p { line-height: 1.5; word-break: break-word; }
    a { color: #00c; text-decoration: underline; }
    .tag { color: #6b0000; font-weight: bold; }

    /* noche */
    body.noche { background: #111; color: #e0e0e0; }
    body.noche header { border-bottom-color: #444; }
    body.noche .tagline { color: #ccc; }
    body.noche #estado { color: #bbb; }
    body.noche #search, body.noche #editor { background: #1a1a1a; color: #e0e0e0; border-color: #444; }
    body.noche #search:focus, body.noche #editor:focus { border-color: #666; }
    body.noche button { background: #e0e0e0; color: #111; }
    body.noche button:hover { background: #bbb; }
    body.noche button:disabled { background: #444; color: #aaa; }
    body.noche .btn-secundario { background: #1a1a1a; color: #e0e0e0; border-color: #555; }
    body.noche .btn-secundario:hover { background: #222; }
    body.noche .post { border-bottom-color: #444; }
    body.noche .meta { color: #e8620a; }
    body.noche a { color: #6ab0f5; }
    body.noche #charcount { color: #aaa; }
    body.noche .marker { color: #6ab0f5; }
    body.noche .tag { color: #e87070; }
  </style>
</head>
<body>

<header>
  <h1>poste.ar <span class="azul">24/7 pp</span> <span class="public">public</span></h1>
  <div class="tagline">escribís y leés sin usuario</div>
  <div id="estado"></div>
</header>

<input id="search" type="text" placeholder="buscar...">
<textarea id="editor" placeholder="escribí algo"></textarea>
<div id="charcount">0 / 500</div>
<div class="botones">
  <button id="btn-post" disabled>postear</button>
  <button id="btn-actualizar" class="btn-secundario">actualizar</button>
</div>
<div id="timeline"></div>

<script>
const MAX = 500;
const estado = document.getElementById('estado');
const timeline = document.getElementById('timeline');
const editor = document.getElementById('editor');
const btn = document.getElementById('btn-post');
const btnActualizar = document.getElementById('btn-actualizar');
const search = document.getElementById('search');
const cc = document.getElementById('charcount');

let todosLosPosts = [], filtro = '';

// d/n
function toggleDN() {
  document.body.classList.toggle('noche');
  localStorage.setItem('dn', document.body.classList.contains('noche') ? '1' : '0');
}
if (localStorage.getItem('dn') === '1') document.body.classList.add('noche');
window.addEventListener("storage", e => { if (e.key === "dn") { document.body.classList.toggle("noche", e.newValue === "1"); } });

function sanitize(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderText(raw) {
  return sanitize(raw)
    .replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*([^*]+)\*/g,'<strong>$1</strong>')
    .replace(/_([^_]+)_/g,'<em>$1</em>')
    .replace(/#(\w+)/g,'<span class="tag">#$1</span>');
}
function formatFecha(fecha) {
  const d = new Date(fecha.replace(' ','T') + '-03:00');
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' +
         d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function renderTimeline() {
  const visible = filtro ? todosLosPosts.filter(p => p.contenido.toLowerCase().includes(filtro)) : todosLosPosts;
  timeline.innerHTML = '';
  visible.forEach(p => {
    const el = document.createElement('div');
    el.className = 'post';
    el.innerHTML = `<span class="meta">${formatFecha(p.fecha)}</span><p><strong class="marker">&gt;&gt;</strong> ${renderText(p.contenido)}</p>`;
    timeline.appendChild(el);
  });
}
async function cargarPosts() {
  try {
    const res = await fetch('/micro/api/posts');
    if (!res.ok) throw new Error();
    todosLosPosts = await res.json();
    renderTimeline(); estado.textContent = '';
  } catch { estado.textContent = 'error al cargar'; }
}
editor.addEventListener('input', () => {
  const len = editor.value.length;
  cc.textContent = `${len} / ${MAX}`;
  cc.classList.toggle('over', len > MAX);
  btn.disabled = len === 0 || len > MAX;
});
btn.addEventListener('click', async () => {
  const texto = editor.value.trim();
  if (!texto || texto.length > MAX) return;
  btn.disabled = true; estado.textContent = 'publicando...';
  try {
    const res = await fetch('/micro/api/post', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contenido: texto})
    });
    if (!res.ok) throw new Error();
    editor.value = ''; cc.textContent = `0 / ${MAX}`; estado.textContent = '';
    await cargarPosts();
  } catch { estado.textContent = 'error al publicar'; btn.disabled = false; }
});
btnActualizar.addEventListener('click', async () => {
  btnActualizar.disabled = true; await cargarPosts(); btnActualizar.disabled = false;
});
let st;
search.addEventListener('input', () => {
  clearTimeout(st);
  st = setTimeout(() => { filtro = search.value.trim().toLowerCase(); renderTimeline(); }, 300);
});
cargarPosts();
</script>
</body>
</html>
