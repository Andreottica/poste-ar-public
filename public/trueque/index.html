<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poste.ar 24/7 tt trueque</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff; color: #111;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px; max-width: 640px;
      margin: 0 auto; padding: 24px 16px;
    }
    @media (max-width: 600px) {
      body { font-size: 14px; padding: 12px 10px; letter-spacing: -0.3px; }
      h1 { font-size: 19px; }
      .aviso-cuerpo { line-height: 1.3; }
      .tagline { font-size: 13px; color: #444; }
      #estado { font-size: 12px; color: #555; }
      .aviso-meta { font-size: 13px; }
      .aviso-num { font-size: 12px; color: #666; }
      .instruccion { font-size: 13px; color: #555; }
      .vacio { font-size: 14px; color: #666; }
    }
    /* noche */
    body.noche { background: #111; color: #e0e0e0; transition: background 0.2s, color 0.2s; }
    body.noche header { border-bottom-color: #333; }
    body.noche .tagline { color: #ccc; }
    body.noche #estado { color: #bbb; }
    body.noche #search { background: #1a1a1a; color: #ddd; border-color: #333; }
    body.noche #search:focus { border-color: #555; }
    body.noche button { background: #1a1a1a; color: #ddd; border-color: #444; }
    body.noche button:hover { background: #222; }
    body.noche .btn-dn { border-color: #444; color: #666; background: none; }
    body.noche .btn-dn:hover { background: #222; color: #ddd; }
    body.noche .aviso { border-bottom-color: #333; }
    body.noche .instruccion { border-color: #444; color: #bbb; }
    body.noche .instruccion a { color: #2e7d32; }
    body.noche .aviso-nick { color: #2e7d32; }
    body.noche .aviso-nick:hover { color: #4caf50; }
    body.noche .vacio { color: #aaa; }
    body.noche a { color: #6ab0f5; }
    header { border-bottom: 2px solid #ddd; padding-bottom: 12px; margin-bottom: 20px; }
    h1 { font-size: 22px; letter-spacing: -1px; }
    .verde { color: #2e7d32; }
    .tt { color: #999; font-size: 0.75em; font-weight: normal; letter-spacing: 2px; margin-left: 8px; }
    .tagline { font-size: 12px; color: #555; margin-top: 4px; }
    #estado { font-size: 11px; color: #999; margin-top: 4px; min-height: 16px; }

    #search {
      width: 100%; border: 1px solid #ddd; padding: 6px 8px;
      font-family: inherit; font-size: 14px; margin-bottom: 16px; outline: none;
    }
    #search:focus { border-color: #aaa; }

    .botones { display: flex; gap: 8px; margin-bottom: 24px; }
    button {
      background: #fff; color: #111; border: 1px solid #ccc;
      padding: 7px 18px; font-family: inherit; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #f5f5f5; }

    .aviso { border-bottom: 1px solid #bbb; padding: 10px 0; }
    .aviso-meta { font-size: inherit; color: #2e7d32; display: block; margin-bottom: 4px; }
    .aviso-num { color: #999; font-size: 0.85em; margin-right: 6px; }
    .aviso-nick {
      cursor: pointer; text-decoration: underline; color: #2e7d32;
      font-weight: bold;
    }
    .aviso-nick:hover { color: #1b5e20; }
    .aviso-cuerpo { line-height: 1.5; word-break: break-word; }
    .aviso-cuerpo strong { font-weight: bold; }
    .aviso-cuerpo em { font-style: italic; }
    a { color: #00c; text-decoration: underline; }

    .vacio { color: #999; font-size: 13px; padding: 16px 0; }
    .instruccion {
      font-size: 12px; color: #777; border: 1px solid #eee;
      padding: 10px 12px; margin-bottom: 20px; line-height: 1.6;
    }
    .instruccion a { color: #2e7d32; }
  </style>
</head>
<body>

<header>
  <h1>poste.ar <span class="verde">24/7 tt</span><span class="tt">trueque</span></h1>
  <div class="tagline">avisos de trueque · se borra cada lunes</div>
  <div id="estado"></div>
</header>

<div class="instruccion">
  Para publicar un aviso: entrá a <a href="/micro">micro mail</a> y escribí a <strong>trueque@</strong><br>
  Para contactar a alguien: hacé click en su nick y te llevará a micro mail
</div>

<input id="search" type="text" placeholder="buscar...">
<div class="botones">
  <button onclick="cargarAvisos()">actualizar</button>
</div>
<div id="timeline"></div>

<script>
const estado = document.getElementById('estado');
const timeline = document.getElementById('timeline');
const search = document.getElementById('search');

let todosLosAvisos = [];
let filtro = '';

// d/n
function toggleDN() {
  document.body.classList.toggle('noche');
  localStorage.setItem('dn', document.body.classList.contains('noche') ? '1' : '0');
}
if (localStorage.getItem('dn') === '1') document.body.classList.add('noche');
window.addEventListener("storage", e => { if (e.key === "dn") { document.body.classList.toggle("noche", e.newValue === "1"); } });

function sanitize(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTexto(raw) {
  return sanitize(raw)
    .replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*([^*]+)\*/g,'<strong>$1</strong>')
    .replace(/_([^_]+)_/g,'<em>$1</em>');
}

function formatFecha(f) {
  if (!f) return '';
  const d = new Date(f.replace(' ','T') + '-03:00');
  const fecha = d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit' });
  const hora  = d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12: false });
  return `${fecha} ${hora}`;
}

function irAMicro(nick) {
  window.location.href = `/micro?para=${encodeURIComponent(nick)}`;
}

function renderTimeline() {
  const visible = filtro
    ? todosLosAvisos.filter(a => a.contenido_trueque.toLowerCase().includes(filtro))
    : todosLosAvisos;

  if (!visible.length) {
    timeline.innerHTML = '<div class="vacio">sin avisos esta semana</div>';
    return;
  }

  timeline.innerHTML = '';
  visible.forEach((a, i) => {
    const nick = a.etiqueta ? a.etiqueta.split('@')[0].trim() : '?';
    const num = todosLosAvisos.length - todosLosAvisos.indexOf(a);
    const el = document.createElement('div');
    el.className = 'aviso';
    el.innerHTML = `
      <span class="aviso-meta">
        <span class="aviso-num">#${num}</span>
        <span class="aviso-nick" onclick="irAMicro('${sanitize(nick)}')" title="escribir a ${sanitize(nick)}@">${sanitize(nick)}@</span>
        · ${formatFecha(a.fecha)}
      </span>
      <div class="aviso-cuerpo">${renderTexto(a.contenido_trueque)}</div>
    `;
    timeline.appendChild(el);
  });
}

async function cargarAvisos() {
  estado.textContent = 'cargando…';
  try {
    const res = await fetch('/trueque/api/avisos');
    if (!res.ok) throw new Error();
    todosLosAvisos = await res.json();
    renderTimeline();
    estado.textContent = '';
  } catch {
    estado.textContent = 'error al cargar';
  }
}

let st;
search.addEventListener('input', () => {
  clearTimeout(st);
  st = setTimeout(() => {
    filtro = search.value.trim().toLowerCase();
    renderTimeline();
  }, 300);
});

cargarAvisos();
</script>
</body>
</html>
